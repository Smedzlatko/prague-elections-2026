# GitLab Pages — dashboard je statická stránka, žádný server není potřeba.
# `dashboard/data/` se generuje v CI z data/core/ + data/research/, takže
# se do gitu nemusí commitovat vygenerovaná kopie dat.
image: python:3.12-slim

stages: [test, deploy]

kontrola:
  stage: test
  script:
    - python3 scripts/validate.py          # kauza bez zdroje, neplatná URL, chybné propojení
    - python3 scripts/check_cestina.py     # typografie — jen hlásí, neopravuje
    - python3 scripts/report_gaps.py       # přehled děr v rešerši
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

pages:
  stage: deploy
  script:
    - python3 scripts/validate.py          # vadná data se nepublikují
    - python3 scripts/build_site.py
    - rm -rf public && mkdir -p public
    - cp -r dashboard/. public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
