# GitHub Pages — dashboard je statická stránka, backend není potřeba.
# dashboard/data/ se generuje tady, do gitu se necommituje.
name: Publikovat dashboard

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # vadná data se nepublikují: kauza bez zdroje, neplatná URL, špatné propojení osob
      - run: python3 scripts/validate.py
      - run: python3 scripts/check_cestina.py
      - run: python3 scripts/report_gaps.py

  publikovat:
    needs: kontrola
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard }
      - id: deployment
        uses: actions/deploy-pages@v4
